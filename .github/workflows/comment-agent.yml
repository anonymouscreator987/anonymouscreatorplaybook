name: comment-agent

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:
    inputs:
      live:
        description: "Post for real (unticked = dry run)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r comment-agent/requirements.txt
      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Scheduled runs post only once you set the repo variable COMMENT_AGENT_LIVE=true.
          LIVE: ${{ github.event_name == 'schedule' && vars.COMMENT_AGENT_LIVE == 'true' || inputs.live }}
        run: |
          if [ "$LIVE" = "true" ]; then FLAG=--live; else FLAG=; fi
          python comment-agent/agent.py $FLAG --hours 6 --max-replies 15
